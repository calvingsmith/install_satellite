---
# DNS layout for laptop.lab:
#   - idm_server_ip: FreeIPA is authoritative for laptop.lab (A/PTR, realm DNS).
#   - gateway_ip: libvirt (or host) forwarder; install-idm sets ipaserver_forwarders: [ gateway_ip ]
#     so IdM resolves the rest of the world without clients needing a public resolver.
#   - Satellite and clients: use idm for resolv/NetworkManager (not the gateway) so *.laptop.lab and
#     forwarders are consistent. Exception: the IdM VM in Phase 1 (install-idm) uses the gateway
#     until the IPA service is up — see host_vars/idm.laptop.lab (dns_server).
# Libvirt host bridge for Foreman NIC (compute profile: type=bridge, not a libvirt network name).
vm_network: "virbr0"
subnet_cidr: "24"
gateway_ip: "192.168.122.1"
satellite_server_ip: "192.168.122.5"
# HTTP boot URI served by the Satellite HTTPBoot smart proxy (port 8000).
# Used by the libvirt_hypervisor_bootmenu_hook role to write /etc/libvirt/hooks/http-boot-uri
# so the qemu.d/50-bootmenu hook can pre-seed NVRAM BootNext before each provisioning boot.
libvirt_bootmenu_http_uri: "http://{{ satellite_server_ip }}:8000/httpboot/grub2/grubx64-httpboot.efi"
satellite_smart_proxy_name: "satellite.laptop.lab"
satellite_url: "https://satellite.laptop.lab"
# Must match group_vars/laptop_lab idm_server_ip
idm_server_ip: "192.168.122.4"

# --- Core IdM Settings ---
ipaserver_domain: "laptop.lab"
ipaserver_realm: "LAPTOP.LAB"
# ipaserver_no_forwarders: "true"
idm_hostname: "idm.laptop.lab"
dhcp_range: "192.168.122.100 192.168.122.200"
# Foreman/Satellite Subnet API (roles/foreman_subnet); must match DHCP/IdM in install-satellite.yml
foreman_subnet_network: "192.168.122.0"
foreman_subnet_name: "laptop-lab"
foreman_subnet_ipam: "DHCP"
foreman_subnet_dhcp_proxy: "{{satellite_smart_proxy_name}}"
foreman_subnet_tftp_proxy: "{{satellite_smart_proxy_name}}"
foreman_subnet_httpboot_proxy: "{{satellite_smart_proxy_name}}"
foreman_subnet_dns_proxy: "{{satellite_smart_proxy_name}}"

# Optional: one-line public key (same as ~/.ssh/casmith.pub) for Foreman host param lab_bootstrap_authorized_key
# if you do not want satellite-lightspeed-demo to read the file from the controller.
# lab_bootstrap_authorized_key: "ssh-ed25519 AAAA... casmith@laptop"
# Libvirt compute resource (Infrastructure → Compute Resources); hypervisor at default network gateway
libvirt_compute_resource_name: "laptop-lab-libvirt"
libvirt_compute_resource_url: "qemu+ssh://libvirt@192.168.122.1/system"
libvirt_compute_resource_display_type: "vnc"

# Compute profile for libvirt (4 GiB RAM, UEFI, qcow2 disk — see roles/libvirt_compute_profile)
libvirt_compute_profile_name: "libvirt-default"

# IdM reverse DNS zones: set in install-idm.yml (ipaserver_reverse_zones) so ipa-server-install creates them.

# --- Satellite IdM integration ---
# Realm/domain (satellite_idm_foreman): host enrollment via kickstart freeipa_register.
# LDAP auth (satellite_idm_auth): IdM users log into Satellite; groups map to Foreman roles.
satellite_idm_auth_enabled: true
satellite_idm_ldap_name: "IdM laptop.lab"
satellite_idm_ldap_port: 636
satellite_idm_ldap_base_dn: "dc=laptop,dc=lab"
satellite_idm_ldap_groups_base: "cn=groups,cn=accounts,dc=laptop,dc=lab"
satellite_idm_ldap_bind_dn: "uid={{ idm_satellite_ldap_bind_user | default('satellite-ldap') }},cn=users,cn=accounts,dc=laptop,dc=lab"
idm_satellite_ldap_bind_user: satellite-ldap

idm_satellite_groups:
  - satellite-admins
  - satellite-operators

idm_satellite_lab_users:
  - name: alice
    first: Alice
    last: Admin
    groups: [satellite-admins]
  - name: brian
    first: Brian
    last: Operator
    groups: [satellite-operators]
  - name: charlie
    first: Charlie
    last: Operator
    groups: [satellite-operators]

satellite_idm_group_mappings:
  # Role names must match `hammer role list` (Satellite 6.18 has no "Administrator").
  - idm_group: satellite-admins
    usergroup: "Satellite IdM Admins"
    roles: [System admin]
  - idm_group: satellite-operators
    usergroup: "Satellite IdM Operators"
    roles: [Viewer]
