---
# Install rhel-system-roles RPM on Satellite, then import firewall role via hammer.

- name: Install rhel-system-roles RPM on Satellite
  # foreman-protector blocks CDN repos until content is synced; use RHSM CDN for Satellite self-packages.
  ansible.builtin.dnf:
    name: "{{ rhel9_firewall_role_rpm }}"
    state: present
    disable_plugin:
      - foreman-protector

- name: Stat firewall Ansible role directory from RPM
  ansible.builtin.stat:
    path: "{{ rhel9_firewall_role_path }}"
  register: rhel9_firewall_role_path_stat

- name: Assert firewall role path exists after RPM install
  ansible.builtin.assert:
    that:
      - rhel9_firewall_role_path_stat.stat.exists
      - rhel9_firewall_role_path_stat.stat.isdir
    fail_msg: >-
      Expected role directory {{ rhel9_firewall_role_path }} missing after installing {{ rhel9_firewall_role_rpm }}.
      Override rhel9_firewall_role_path (see rpm -ql {{ rhel9_firewall_role_rpm }}).

- name: Get Smart Proxy ID for firewall Ansible role import
  ansible.builtin.command:
    argv:
      - hammer
      - "--output"
      - json
      - proxy
      - info
      - "--name"
      - "{{ satellite_smart_proxy_name }}"
  register: rhel9_firewall_proxy_info
  changed_when: false

- name: Set Smart Proxy ID for firewall role hammer import
  vars:
    _proxy: "{{ rhel9_firewall_proxy_info.stdout | from_json }}"
  ansible.builtin.set_fact:
    satellite_firewall_ansible_smart_proxy_id: "{{ _proxy.id | default(_proxy.Id) }}"

- name: Assert Smart Proxy ID was resolved for firewall role import
  ansible.builtin.assert:
    that:
      - satellite_firewall_ansible_smart_proxy_id is defined
      - satellite_firewall_ansible_smart_proxy_id | string | length > 0
    fail_msg: >-
      Could not read id from `hammer --output json proxy info --name {{ satellite_smart_proxy_name }}`.

- name: Import firewall Ansible role into Satellite from Smart Proxy
  ansible.builtin.command:
    argv:
      - hammer
      - ansible
      - roles
      - import
      - "--proxy-id"
      - "{{ satellite_firewall_ansible_smart_proxy_id | string }}"
      - "--role-names"
      - "{{ rhel9_firewall_role_name }}"
  register: rhel9_firewall_hammer_import
  changed_when: rhel9_firewall_hammer_import.rc == 0
  failed_when: rhel9_firewall_hammer_import.rc != 0
